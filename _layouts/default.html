<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <!-- Open Graph / Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:image" content="{{ site.url }}{% if page.image %}{{ page.image }}{% else %}/assets/hero.png{% endif %}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta name="twitter:image" content="{{ site.url }}{% if page.image %}{{ page.image }}{% else %}/assets/hero.png{% endif %}">
  <meta name="twitter:site" content="@failedarchitekt">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% feed_meta %}
  {% seo %}
</head>
<body>
  <div class="site-wrapper">
    <header>
      <a class="site-title" href="{{ '/' | relative_url }}">Joel Artturi Saarinen</a>
      <nav>
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
        <a href="{{ '/projects' | relative_url }}" {% if page.url contains 'projects' %}class="active"{% endif %}>Projects</a>
        <a href="{{ '/research' | relative_url }}" {% if page.url contains 'research' or page.url contains 'writing' %}class="active"{% endif %}>Research/Writing</a>
        <a class="nav-icon" href="https://failedarchitekt.substack.com" target="_blank" rel="noopener" title="Substack">
  <svg width="16" height="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.539 8.242H1.46V5.406h21.08v2.836zM1.46 10.812V24L12 18.11 22.54 24V10.812H1.46zM22.54 0H1.46v2.836h21.08V0z"/></svg>
</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      <p>Joel Artturi Saarinen</p>
      <div class="footer-links">
        <a href="mailto:your@email.com">Email</a>
        <a href="https://github.com/joeliosa" target="_blank" rel="noopener">GitHub</a>
        <a href="https://scholar.google.com" target="_blank" rel="noopener">Scholar</a>
      </div>
    </footer>
  </div>
</body>
</html>
